# ============================================================================
# Collinearity Analysis Configuration (MCScanX)
# 共线性分析配置文件
# ============================================================================

# 项目名称/前缀 (必需，用于输出文件命名)
project_name: "my_collinearity"

# 输出目录 (必需)
output_dir: "/path/to/output"

# ============================================================================
# 输入文件 (二选一)
# ============================================================================

# 方式1: 提供原始数据，脚本自动准备 MCScanX 输入
# 适用于首次分析
gff_file: "/path/to/genes.gff3"           # GFF3 格式基因注释文件
protein_file: "/path/to/proteins.fa"      # 蛋白质 FASTA 文件

# 方式2: 提供已准备好的 MCScanX 格式文件
# 适用于已有处理好的数据
# mcscanx_gff: "/path/to/project.gff"     # MCScanX 格式: sp#gene chr start end
# mcscanx_blast: "/path/to/project.blast" # BLAST -outfmt 6 格式

# ============================================================================
# MCScanX 参数
# ============================================================================

# 匹配分数阈值 (默认: 50)
# 较高的值 = 更严格的共线性检测
match_score: 50

# 共线性块最小基因数 (默认: 5)
# 较高的值 = 只保留较长的共线性块
match_size: 5

# 间隙惩罚 (默认: -1)
gap_penalty: -1

# 重叠窗口 (默认: 5)
overlap_window: 5

# BLAST E-value 阈值 (默认: 1e-10)
e_value: 1e-10

# BLAST 线程数 (默认: 4)
num_threads: 4

# ============================================================================
# 可视化参数
# ============================================================================

# 是否运行可视化 (默认: true)
run_visualization: true

# 可视化类型 (可选: dot, dual, circle, bar)
# dot    - 点阵图 (Dot Plot)
# dual   - 双基因组共线性图 (Dual Synteny Plot)
# circle - 圆形图 (Circle Plot，使用贝塞尔曲线连接)
# bar    - 条形图 (Bar Plot)
plot_types: "dot,circle,bar"

# ============================================================================
# 输入文件格式说明
# ============================================================================
#
# 1. GFF3 格式 (标准基因注释):
#    Chr1  source  gene  1000  2000  .  +  .  ID=Gene1;Name=Gene1
#    Chr1  source  mRNA  1000  2000  .  +  .  ID=Gene1.1;Parent=Gene1
#
# 2. MCScanX gff 格式 (sp#gene chr start end):
#    sp#Gene1  Chr1  1000  2000
#    sp#Gene2  Chr1  3000  4000
#
# 3. BLAST 结果格式 (-outfmt 6):
#    Gene1  Gene2  95.00  200  10  0  1  200  1  200  1e-50  400
#
# ============================================================================
# 输出文件说明
# ============================================================================
#
# output_dir/
# ├── project.gff           # MCScanX 格式基因位置
# ├── project.blast         # BLASTP 比对结果
# ├── project.collinearity  # 共线性块结果
# ├── project_report.txt    # 分析报告
# └── visualization/
#     ├── dot_plot.png      # 点阵图
#     ├── circle_plot.png   # 圆形图 (贝塞尔曲线)
#     └── bar_plot.png      # 条形图
#
# ============================================================================
# 使用示例
# ============================================================================
#
# 运行命令:
#    bash PanFamily.sh Analysis collinearity -c Scripts/collinearity.yaml
#
# ============================================================================

